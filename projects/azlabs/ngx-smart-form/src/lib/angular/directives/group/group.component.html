<ng-container *ngIf="formGroup">
  <ng-container *ngTemplateOutlet="_recursive; context: { group: formGroup, controls: inputs }"></ng-container>
</ng-container>

<ng-template #_recursive let-controls="controls" let-group="group">
  <div class="input-row" *ngIf="!!!noGridLayout; else noGridRef">
    <ng-container *ngTemplateOutlet="recursivePreviewTemplate; context: { controls, group }"></ng-container>
  </div>
  <ng-template #noGridRef>
    <ng-container *ngTemplateOutlet="recursivePreviewTemplate; context: { controls, group }"></ng-container>
  </ng-template>
  <ng-template #recursivePreviewTemplate let-controls="controls" let-group="group">
    <ng-container *ngFor="let value of controls">
      <ng-container *ngIf="(value!.children || []).length > 0; else templateRef">
        <ng-container *ngIf="!!!noGridLayout">
          <div class="input-row" [hidden]="(value | ishidden) || (group | inarray : detached)">
            <ng-container *ngTemplateOutlet="previewTemplate; context: { value, group }"></ng-container>
          </div>
        </ng-container>
        <ng-container *ngIf="!!noGridLayout">
          <div [hidden]="(value | ishidden) || (group | inarray : detached)">
            <ng-container *ngTemplateOutlet="previewTemplate; context: { value, group }"></ng-container>
          </div>
        </ng-container>
        <ng-template #previewTemplate let-value="value" let-group="group">
          <div [class]="noGridLayout ? 'ngx-form-no-grid' : value.containerClass">
            <div [innerHTML]="value.label | safeHtml"></div>
            <ng-container *ngTemplateOutlet="_recursive; context: {controls: value!.children || [], group: group.get(value.name)}"></ng-container>
          </div>
        </ng-template>
      </ng-container>
      <ng-template #templateRef>
        <div *ngIf="group.get(value.name) as control" [class]="noGridLayout ? 'ngx-form-no-grid' : value.containerClass"
          [hidden]="(value | ishidden) || (control | inarray : detached)">
          <ng-container *ngTemplateOutlet="template; context: { control, value, autoupload }"></ng-container>
        </div>
      </ng-template>
    </ng-container>
  </ng-template>
</ng-template>
