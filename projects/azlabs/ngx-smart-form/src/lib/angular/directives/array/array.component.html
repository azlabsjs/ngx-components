<ngx-form-array-outlet [class.hidden]="hidden" (removed)="removed($event)" [inputs]="inputs" [auto-upload]="autoupload"
  [template]="template" [no-grid-layout]="noGridLayout" [detached]="detached" *ngIf="!(cssClass | istable)" #container>
  <section description>
    <ng-container *ngIf="tabledescription">
      <ng-container *ngTemplateOutlet="tabledescription; context: {$implicit: name, name, description}"></ng-container>
    </ng-container>
  </section>
  <ng-container *ngIf="refCount === 0">
    <ng-container *ngTemplateOutlet="_placeholder; context: {$implicit: placeholder, add:  add.bind(this)}"></ng-container>
  </ng-container>
  <ng-container *ngIf="refCount !== 0">
    <ng-container *ngTemplateOutlet="addref ? addref : _add; context: { $implicit: add.bind(this) }"></ng-container>
  </ng-container>
</ngx-form-array-outlet>

<!-- table layout -->
<ngx-table-form [class.hidden]="hidden" (removed)="removed($event)" [inputs]="inputs" [auto-upload]="autoupload" [template]="template" [label]="label" [detached]="detached" [title]="title" [modal]="modal" [name]="name" *ngIf="cssClass.includes('table')" #container>
  <section description>
    <ng-container *ngIf="tabledescription">
      <ng-container *ngTemplateOutlet="tabledescription; context: {$implicit: name, name, description}"></ng-container>
    </ng-container>
  </section>
  <ng-container *ngTemplateOutlet="addref ? addref : _add; context: { $implicit: add.bind(this) }"></ng-container>
</ngx-table-form>

<ng-template #_add let-handler>
  <div class="margin-top add-button">
    <ngx-add-button (click)="handler($event)"></ngx-add-button>
  </div>
</ng-template>


<ng-template #_placeholder let-add="add">
  <div  class="w-full mt-4 relative rounded-2xl border-dashed-crisp bg-gradient-to-b from-slate-50/70 via-white to-slate-50/40 px-8 py-4 text-center flex flex-col items-center justify-center shadow-xs">
    <div class="relative">
      <div (click)="add($event)" class="cursor-pointer relative w-14 h-14 rounded-2xl bg-white border border-slate-200/90 shadow-xs flex items-center justify-center">
        <svg class="w-10 h-10" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="7" y="6" width="30" height="9" rx="3.5" class="fill-slate-100 stroke-slate-200" stroke-width="1.2" />
          <rect x="11" y="9.5" width="8" height="2" rx="1" class="fill-slate-300" />

          <rect x="5" y="16" width="34" height="18" rx="5.5" class="fill-white stroke-slate-300" stroke-width="1.4" />
          <rect x="9" y="21" width="10" height="2" rx="1" class="fill-primary-600" />
          <rect x="9" y="25.5" width="26" height="3" rx="1.5" class="fill-slate-100 stroke-slate-200"
            stroke-width="0.8" />
          <line x1="12" y1="26.5" x2="12" y2="28" stroke="#4F46E5" stroke-width="1.2" stroke-linecap="round"
            class="animate-pulse" />
          <circle cx="34" cy="14" r="6" class="fill-primary-600 stroke-white" stroke-width="1.5" />
          <path d="M34 11.5V16.5M31.5 14H36.5" stroke="white" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <section class="px-4 py-2">
      <ng-container *ngTemplateOutlet="addref ? addref : _add; context: { $implicit: add.bind(this) }"></ng-container>
    </section>
  </div>
</ng-template>
